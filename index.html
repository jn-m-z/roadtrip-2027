<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14303F">
<title>Roadtrip 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#0E1A22;color:#E8EEEC;
    font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace;
    overflow:hidden;
  }
  .gate{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    transition:transform .75s cubic-bezier(.45,0,.7,0), opacity .75s ease-in;
    transform-origin:50% 69%;
  }
  .gate.depart{transform:scale(1.7);opacity:0}
  .scene{position:absolute;inset:0}
  .scene svg{width:100%;height:100%;display:block}
  .scene::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,.6) .5px, transparent .6px);
    background-size:3px 3px;opacity:.3;mix-blend-mode:multiply;
  }
  #arm{transform-box:view-box;transform-origin:690px 762px;transition:transform 1.05s cubic-bezier(.3,1.35,.5,1)}
  #arm.up{transform:rotate(74deg)}
  #lampRed,#lampGreen{transition:opacity .3s}

  .panel{
    position:relative;width:min(400px,calc(100% - 32px));
    background:rgba(9,20,27,.74);border:1px solid rgba(190,214,210,.22);
    border-radius:14px;padding:30px 28px 26px;backdrop-filter:blur(14px);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.95);
    transition:opacity .45s ease, transform .45s ease;
    margin-bottom:16vh;
  }
  .panel.away{opacity:0;transform:translateY(-18px)}
  .plate{
    display:inline-block;background:#0B4F9E;color:#fff;border-radius:4px;
    padding:4px 11px 3px;font-family:"Barlow Condensed",sans-serif;font-weight:600;
    font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;
  }
  h1{
    font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;
    font-size:46px;line-height:.98;letter-spacing:-.01em;text-transform:uppercase;
    margin:14px 0 0;color:#F2F6F4;
  }
  .sub{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#9FB4B2;margin:12px 0 0;line-height:1.6}
  form{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8FA5A3}
  input{
    width:100%;font-family:inherit;font-size:16px;color:#F2F6F4;
    background:rgba(4,12,17,.7);border:1px solid rgba(190,214,210,.28);
    border-radius:8px;padding:13px 14px;letter-spacing:.02em;
  }
  input::placeholder{color:#6C817F}
  input:focus{outline:2px solid #4E8FD8;outline-offset:1px;border-color:transparent}
  button{
    font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;background:#E8EEEC;color:#0E1A22;border:0;border-radius:8px;
    padding:13px 18px 11px;cursor:pointer;min-height:48px;
  }
  button:disabled{opacity:.55;cursor:progress}
  button:focus-visible{outline:2px solid #4E8FD8;outline-offset:2px}
  .msg{min-height:19px;margin:12px 0 0;font-size:12.5px;color:#E79180;letter-spacing:.03em}
  .msg.ok{color:#7FCFA1}
  .shake{animation:shake .42s}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
  }
  @media (prefers-reduced-motion:reduce){
    .gate,.panel,#arm,.shake{transition:none!important;animation:none!important}
  }
  @media (max-width:520px){ h1{font-size:38px} .panel{padding:26px 22px 22px;margin-bottom:10vh} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="scene"><svg id="sc" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg></div>

  <div class="panel" id="panel">
    <span class="plate">Grenzübergang</span>
    <h1>Roadtrip<br>2027</h1>
    <p class="sub">Die Schranke öffnet nur mit Kennwort.<br>Steht in der Gruppe.</p>
    <form id="f" autocomplete="off">
      <label for="pw">Kennwort</label>
      <input id="pw" type="password" inputmode="text" autocapitalize="none" autocorrect="off"
             spellcheck="false" placeholder="••••••••••" aria-describedby="msg">
      <button type="submit" id="go">Schranke öffnen</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
  </div>
</div>

/* ── Kulisse: Morgengrauen, Bergketten, Straße ── */
function seeded(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function f1(n){ return (+n).toFixed(1); }

function ridge(r, W, H, baseY, amp, steps, c){
  var pts = [], i, t, y;
  for(i = 0; i <= steps; i++){
    t = i / steps;
    y = baseY - amp * (0.28 + 0.72 * r()) * (0.5 + 0.5 * Math.sin(t * Math.PI * 1.05));
    pts.push(f1(W * t) + "," + f1(y));
  }
  return '<path d="M0,' + H + ' L' + pts.join(" L") + ' L' + W + ',' + H + ' Z" fill="' + c + '"/>';
}

/* Alles, was der Nutzer sehen muss — Schild, Ampel, Pfosten, Schranke — liegt
   zwischen x 400 und x 810, damit es auch im Hochkant-Zuschnitt stehen bleibt. */
function buildScene(){
  var W = 1200, H = 900, hy = 620, r = seeded(7001), s = "", i, t0, t1, y0, y1, w0, w1;

  s += '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">' +
       '<stop offset="0" stop-color="#122C3B"/><stop offset="0.34" stop-color="#2C5567"/>' +
       '<stop offset="0.58" stop-color="#7C8E85"/><stop offset="0.74" stop-color="#D89A63"/>' +
       '<stop offset="0.86" stop-color="#EFBE85"/></linearGradient></defs>';
  s += '<rect width="' + W + '" height="' + H + '" fill="url(#sky)"/>';
  s += '<circle cx="332" cy="462" r="52" fill="#F6D9A4" opacity="0.92"/>';
  s += ridge(r, W, H, 520, 208, 17, "#3E6272");
  s += ridge(r, W, H, 572, 164, 14, "#2A4756");
  s += ridge(r, W, H, 620, 112, 12, "#1A3140");

  /* Straße mit perspektivischem Mittelstreifen */
  s += '<path d="M' + f1(W * 0.462) + ',' + hy + ' L' + f1(W * 0.538) + ',' + hy +
       ' L' + f1(W * 1.3) + ',' + H + ' L' + f1(-W * 0.3) + ',' + H + ' Z" fill="#141F27"/>';
  for(i = 0; i < 8; i++){
    t0 = Math.pow(i / 8, 2.3); t1 = Math.pow((i + 0.48) / 8, 2.3);
    y0 = hy + (H - hy) * t0; y1 = hy + (H - hy) * t1;
    w0 = 0.8 + W * 0.011 * t0; w1 = 0.8 + W * 0.011 * t1;
    s += '<polygon points="' + f1(W * 0.5 - w0) + ',' + f1(y0) + ' ' + f1(W * 0.5 + w0) + ',' + f1(y0) +
         ' ' + f1(W * 0.5 + w1) + ',' + f1(y1) + ' ' + f1(W * 0.5 - w1) + ',' + f1(y1) +
         '" fill="#E4C079" opacity="0.9"/>';
  }

  /* Kontrollhäuschen, rechts hinter der Schranke */
  s += '<rect x="860" y="666" width="220" height="234" fill="#101C24"/>';
  s += '<rect x="890" y="700" width="112" height="62" fill="#E9C27E" opacity="0.8"/>';

  /* Statusschild über der Straße, mittig — überlebt jeden Zuschnitt */
  s += '<rect x="420" y="620" width="370" height="50" rx="4" fill="#0A1319" stroke="#2E4652" stroke-width="1.5"/>';
  s += '<circle id="lampRed" cx="452" cy="645" r="13" fill="#E0523A"/>';
  s += '<circle id="lampGreen" cx="488" cy="645" r="13" fill="#2F5A43" opacity="0.45"/>';
  s += '<text id="status" x="518" y="652" font-family="IBM Plex Mono, monospace" ' +
       'font-size="18" letter-spacing="2.5" fill="#E07A62">GESCHLOSSEN</text>';

  /* Pfosten und Schranke */
  s += '<rect x="676" y="762" width="28" height="138" fill="#16232B"/>';
  s += '<g id="arm">';
  s += '<rect x="690" y="744" width="72" height="36" rx="4" fill="#16232B"/>';
  for(i = 0; i < 12; i++){
    s += '<rect x="' + (690 - (i + 1) * 68) + '" y="751" width="68" height="22" fill="' +
         (i % 2 ? "#F2F0EA" : "#CE3A2A") + '"/>';
  }
  s += '<circle cx="690" cy="762" r="10" fill="#0A1319"/>';
  s += '</g>';
  return s;
}
document.getElementById("sc").innerHTML = buildScene();

/* ── Entschlüsselung ── */
function fromB64(s){
  var bin = atob(s), a = new Uint8Array(bin.length), i;
  for(i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

function decrypt(pw){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
    .then(function(km){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:fromB64(VAULT.s), iterations:VAULT.it, hash:"SHA-256" },
        km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    })
    .then(function(key){
      return crypto.subtle.decrypt({ name:"AES-GCM", iv:fromB64(VAULT.iv) }, key, fromB64(VAULT.c));
    })
    .then(function(buf){ return new TextDecoder().decode(buf); });
}

/* ── Die entschlüsselte Seite an die Stelle dieser setzen ── */
function openPage(html){
  var parsed = new DOMParser().parseFromString(html, "text/html");
  document.replaceChild(document.importNode(parsed.documentElement, true), document.documentElement);
  /* Über importNode eingefügte Skripte laufen nicht von selbst — neu anlegen. */
  Array.prototype.forEach.call(document.querySelectorAll("script"), function(old){
    var s = document.createElement("script"), i;
    for(i = 0; i < old.attributes.length; i++)
      s.setAttribute(old.attributes[i].name, old.attributes[i].value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
  document.documentElement.style.opacity = "0";
  requestAnimationFrame(function(){
    document.documentElement.style.transition = "opacity .55s ease";
    document.documentElement.style.opacity = "1";
  });
}

var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function wait(ms){ return new Promise(function(r){ setTimeout(r, reduced ? 0 : ms); }); }

function raise(html){
  document.getElementById("lampRed").setAttribute("opacity", "0.25");
  document.getElementById("lampGreen").setAttribute("fill", "#49C480");
  document.getElementById("lampGreen").setAttribute("opacity", "1");
  var st = document.getElementById("status");
  st.textContent = "FREIE FAHRT";
  st.setAttribute("fill", "#7FCFA1");
  document.getElementById("panel").classList.add("away");
  document.getElementById("arm").classList.add("up");
  return wait(1150)
    .then(function(){ document.getElementById("gate").classList.add("depart"); return wait(780); })
    .then(function(){ openPage(html); });
}

var form = document.getElementById("f"),
    pw = document.getElementById("pw"),
    go = document.getElementById("go"),
    msg = document.getElementById("msg"),
    panel = document.getElementById("panel");

function fail(text){
  msg.className = "msg";
  msg.textContent = text;
  panel.classList.remove("shake");
  void panel.offsetWidth;
  panel.classList.add("shake");
  go.disabled = false;
  go.textContent = "Schranke öffnen";
  pw.select();
}

function attempt(value, silent){
  if(!value) return;
  go.disabled = true;
  go.textContent = "Prüfe …";
  msg.className = "msg ok";
  msg.textContent = "";
  return decrypt(value).then(function(html){
    try{ sessionStorage.setItem("rt27", value); }catch(e){}
    return raise(html);
  }, function(){
    try{ sessionStorage.removeItem("rt27"); }catch(e){}
    if(!silent) fail("Kennwort stimmt nicht.");
    else { go.disabled = false; go.textContent = "Schranke öffnen"; }
  });
}

form.addEventListener("submit", function(e){ e.preventDefault(); attempt(pw.value, false); });

if(!(window.crypto && crypto.subtle)){
  fail("Dieser Browser kann die Seite nicht entschlüsseln. Bitte Chrome, Safari oder Firefox verwenden.");
  go.disabled = true;
} else {
  /* In derselben Sitzung nicht erneut fragen. */
  var saved = null;
  try{ saved = sessionStorage.getItem("rt27"); }catch(e){}
  if(saved) attempt(saved, true); else pw.focus();
}
</script>
</body>
</html>
